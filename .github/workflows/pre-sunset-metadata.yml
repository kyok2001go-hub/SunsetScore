name: SunsetScore Pre-Sunset Metadata

on:
  schedule:
    - cron: '13 4 * * *'
    - cron: '13 8 * * *'
  workflow_dispatch:
    inputs:
      submit:
        description: '真正提交到D1；关闭时仅Dry Run'
        required: true
        default: false
        type: boolean
      cities:
        description: '城市列表，逗号分隔；留空使用默认城市'
        required: false
        default: ''
        type: string

env:
  DEFAULT_METADATA_CITIES: '深圳,广州,北京,上海,兰州,西宁,银川,西安,太原,武汉,长沙,南京,杭州,昆明'
  METADATA_TIMEZONE: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: sunsetscore-pre-sunset-metadata
  cancel-in-progress: false

jobs:
  collect:
    name: Collect metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve collector mode
        id: collector-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SUBMIT: ${{ inputs.submit }}
          MANUAL_CITIES: ${{ inputs.cities }}
          DEFAULT_CITIES: ${{ env.DEFAULT_METADATA_CITIES }}
          SCHEDULED_TIMEZONE: ${{ env.METADATA_TIMEZONE }}
        run: |
          submit=false
          cities="$DEFAULT_CITIES"
          schedule_cron=''
          slot=''

          if [[ "$EVENT_NAME" == 'schedule' ]]; then
            submit=true
            schedule_cron="$EVENT_SCHEDULE"
            slot=$(node scripts/pre-sunset-metadata.mjs --resolve-scheduled-slot)
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$MANUAL_SUBMIT" == 'true' ]]; then
              submit=true
            fi
            if [[ -n "${MANUAL_CITIES//[[:space:]]/}" ]]; then
              cities="$MANUAL_CITIES"
            fi
            slot=$(TZ="$SCHEDULED_TIMEZONE" date +%H%M)
          else
            echo "Unsupported workflow trigger: $EVENT_NAME" >&2
            exit 1
          fi

          delimiter="METADATA_CITIES_${GITHUB_RUN_ID}_${RANDOM}"
          {
            echo "submit=$submit"
            echo "slot=$slot"
            echo "trigger=$EVENT_NAME"
            echo "schedule_cron=$schedule_cron"
            echo "cities<<$delimiter"
            echo "$cities"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Collect metadata
        run: npm run metadata:collect
        env:
          SUNSETSCORE_URL: https://sunsetscore.pages.dev
          SUBMIT: ${{ steps.collector-mode.outputs.submit }}
          METADATA_CITIES: ${{ steps.collector-mode.outputs.cities }}
          METADATA_SLOT: ${{ steps.collector-mode.outputs.slot }}
          METADATA_TRIGGER: ${{ steps.collector-mode.outputs.trigger }}
          METADATA_SCHEDULE_CRON: ${{ steps.collector-mode.outputs.schedule_cron }}
          METADATA_TIMEZONE: ${{ env.METADATA_TIMEZONE }}
          METADATA_CONCURRENCY: '2'
          NAVIGATION_TIMEOUT_MS: '45000'
          PREDICTION_TIMEOUT_MS: '120000'
          ARTIFACTS_DIR: artifacts

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-sunset-metadata-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
