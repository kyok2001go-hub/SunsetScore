name: SunsetScore Pre-Sunset Metadata

on:
  workflow_dispatch:
    inputs:
      submit:
        description: '真正提交到D1；关闭时仅Dry Run'
        required: true
        default: false
        type: boolean
      cities:
        description: '城市列表，逗号分隔；留空使用默认城市'
        required: false
        default: ''
        type: string
      slot:
        description: '业务计划时段 HHMM（scheduled 必填；manual 留空时自动取当前时区时间）'
        required: false
        default: ''
        type: string
      run_type:
        description: '运行类型 (manual/scheduled)'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - scheduled

env:
  DEFAULT_METADATA_CITIES: '深圳,广州,北京,上海,兰州,西宁,银川,西安,太原,武汉,长沙,南京,杭州,昆明'
  METADATA_TIMEZONE: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: sunsetscore-pre-sunset-metadata
  cancel-in-progress: false

jobs:
  collect:
    name: Collect metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve collector mode
        id: collector-mode
        shell: bash
        env:
          INPUT_SUBMIT: ${{ inputs.submit }}
          INPUT_CITIES: ${{ inputs.cities }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_RUN_TYPE: ${{ inputs.run_type }}
          DEFAULT_CITIES: ${{ env.DEFAULT_METADATA_CITIES }}
          SCHEDULED_TIMEZONE: ${{ env.METADATA_TIMEZONE }}
        run: |
          submit=false
          if [[ "$INPUT_SUBMIT" == 'true' ]]; then
            submit=true
          fi

          cities="$DEFAULT_CITIES"
          if [[ -n "${INPUT_CITIES//[[:space:]]/}" ]]; then
            cities="$INPUT_CITIES"
          fi

          run_type="${INPUT_RUN_TYPE:-manual}"
          if [[ "$run_type" != "manual" && "$run_type" != "scheduled" ]]; then
            echo "Error: Invalid run_type: $run_type (must be manual or scheduled)" >&2
            exit 1
          fi

          slot_input="${INPUT_SLOT//[[:space:]]/}"
          if [[ "$run_type" == 'scheduled' ]]; then
            if [[ -z "$slot_input" ]]; then
              echo "Error: slot is required when run_type is scheduled" >&2
              exit 1
            fi
            if ! [[ "$slot_input" =~ ^([01][0-9]|2[0-3])[0-5][0-9]$ ]]; then
              echo "Error: Invalid scheduled slot: $slot_input (must be 4-digit HHMM between 0000 and 2359)" >&2
              exit 1
            fi
            slot="$slot_input"
          else
            if [[ -n "$slot_input" ]]; then
              if ! [[ "$slot_input" =~ ^([01][0-9]|2[0-3])[0-5][0-9]$ ]]; then
                echo "Error: Invalid manual slot: $slot_input (must be 4-digit HHMM between 0000 and 2359)" >&2
                exit 1
              fi
              slot="$slot_input"
            else
              slot=$(TZ="$SCHEDULED_TIMEZONE" date +%H%M)
            fi
          fi

          delimiter="METADATA_CITIES_${GITHUB_RUN_ID}_${RANDOM}"
          {
            echo "submit=$submit"
            echo "slot=$slot"
            echo "run_type=$run_type"
            echo "cities<<$delimiter"
            echo "$cities"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Collect metadata
        run: npm run metadata:collect
        env:
          SUNSETSCORE_URL: https://sunsetscore.pages.dev
          SUBMIT: ${{ steps.collector-mode.outputs.submit }}
          METADATA_CITIES: ${{ steps.collector-mode.outputs.cities }}
          METADATA_SLOT: ${{ steps.collector-mode.outputs.slot }}
          METADATA_RUN_TYPE: ${{ steps.collector-mode.outputs.run_type }}
          METADATA_TRIGGER: workflow_dispatch
          METADATA_TIMEZONE: ${{ env.METADATA_TIMEZONE }}
          METADATA_CONCURRENCY: '2'
          NAVIGATION_TIMEOUT_MS: '45000'
          PREDICTION_TIMEOUT_MS: '120000'
          ARTIFACTS_DIR: artifacts

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-sunset-metadata-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
