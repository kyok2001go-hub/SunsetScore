# Temporary diagnostic workflow. Remove after scheduled triggering is verified.
name: SunsetScore Schedule Probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunsetscore-schedule-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Record scheduled trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Record trigger details
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          triggered_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "event=$EVENT_NAME"
          echo "schedule=$EVENT_SCHEDULE"
          echo "triggered_at_utc=$triggered_at_utc"
          echo "run_id=$WORKFLOW_RUN_ID"
          echo "head_sha=$HEAD_SHA"

          {
            echo '## SunsetScore schedule probe'
            echo
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Schedule: \`$EVENT_SCHEDULE\`"
            echo "- Recorded at UTC: \`$triggered_at_utc\`"
            echo "- Run ID: \`$WORKFLOW_RUN_ID\`"
            echo "- Head SHA: \`$HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
